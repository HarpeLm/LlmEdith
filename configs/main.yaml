# ~320M paramètres : la run principale de LlmEdith sur TPU Kaggle
name: main
model:
  d_model: 1024
  n_layers: 24
  n_heads: 16
  n_kv_heads: 4
  head_dim: 64
  ffn_dim: 3072
  max_seq_len: 2048
train:
  seq_len: 2048
  global_batch_seqs: 256        # ~0,5M tokens par step
  micro_batch_seqs: 8           # par cœur TPU
  total_tokens: 2.0e10          # 20 milliards de tokens ≈ 38k steps
  lr: 2.0e-3
  warmup_steps: 1000
  decay_frac: 0.2
data:
  train_pattern: shards/train_*.bin
  val_pattern: shards/val_*.bin
  anneal_pattern: shards/anneal_*.bin
