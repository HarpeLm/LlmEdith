[project]
name = "llmedith"
version = "0.1.0"
description = "LlmEdith : un LLM anglais construit de zéro (PyTorch GPU + JAX TPU)"
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml", "tokenizers", "safetensors", "huggingface_hub"]

[project.optional-dependencies]
torch = ["torch>=2.5"]
jax = ["jax>=0.4.35", "optax"]
data = ["datasets"]
eval = ["transformers>=4.51", "lm-eval>=0.4.5", "accelerate"]
dev = ["pytest", "transformers>=4.51"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llmedith*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
